name: Auto PR — dev → production

on:
  push:
    branches:
      - dev

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  create-pr:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

     - name: Create PR (dev → production)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          EXISTING=$(gh pr list \
            --base production \
            --head dev \
            --state open \
            --json number \
            --jq '.[0].number')

          if [ -n "$EXISTING" ]; then
            echo "PR #$EXISTING аль хэдийн нээлттэй байна, алгасаж байна."
          else
            BODY=$(cat <<'EOF'
          ## Автоматаар үүсгэсэн PR
          **Гарал:** `dev`
          **Очих:** `production`
          ### Хийх зүйл
          - [ ] Code review
          - [ ] QA шалгалт
          - [ ] Merge зөвшөөрөх
          EOF
            )
            gh pr create \
              --base production \
              --head dev \
              --title "Deploy: dev to production ($(date '+%Y-%m-%d %H:%M'))" \
              --body "$BODY"
          fi